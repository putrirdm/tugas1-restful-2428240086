$kind: http-request
url: "{{base_url}}disaster-reports"
method: POST
headers:
  x-api-key: "{{api_key}}"
body:
  type: json
  content: "{\r

    \  \"jenisBencana\": \"banjir\",\r

    \  \"lokasi\": \"Kec. Ilir Timur II\",\r

    \  \"tanggal\": \"2026-10-20\",\r

    \  \"tingkatKeparahan\": \"sedang\",\r

    \  \"jumlahPengungsi\": 150\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code adalah 201\", function () {\r

      \    pm.response.to.have.status(201);\r

      });\r

      \r

      pm.test(\"Respons berhasil menambahkan laporan\", function () {\r

      \    const jsonData = pm.response.json();\r

      \    const laporan = jsonData.data ?? jsonData;\r

      \r

      \    pm.expect(laporan).to.have.property(\"id\");\r

      \    pm.expect(laporan.jenisBencana).to.eql(\"banjir\");\r

      \r

      \    pm.environment.set(\"bencanaId\", String(laporan.id));\r

      });"
    language: text/javascript
order: 2000
